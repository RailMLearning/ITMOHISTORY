<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow-202B2C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#202B2C"/></marker><marker id="arrow-244F6C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#244F6C"/></marker><marker id="arrow-963F32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#963F32"/></marker><marker id="arrow-AB7A30" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#AB7A30"/></marker></defs><rect x="0" y="0" width="1920" height="1080" fill="#F1EEE6"/><text x="80" y="65" font-family="Segoe UI" font-size="24" font-weight="600" fill="#244F6C">HISTORY DUEL</text><path d="M80,90L1840,90" fill="none" stroke="#202B2C" stroke-width="2"/><text x="80" y="170" font-family="Georgia" font-size="58" font-weight="400" fill="#202B2C">Как вопрос превращается в ответ с источниками</text><text x="80" y="224" font-family="Segoe UI" font-size="31" font-weight="400" fill="#596664">RAG: сначала система ищет контекст в книгах, затем передаёт его языковой модели</text><rect x="80" y="272" width="1760" height="100" fill="#202B2C"/><text x="112" y="338" font-family="Segoe UI" font-size="40" font-weight="400" fill="#F1EEE6">Вопрос: «Должна ли Россия следовать европейскому пути?»</text><rect x="80" y="432" width="510" height="310" fill="#FBFAF6" stroke="#244F6C" stroke-width="2"/><text x="110" y="487" font-family="Segoe UI" font-size="40" font-weight="600" fill="#244F6C">Поиск по смыслу</text><text x="110" y="540" font-family="Segoe UI" font-size="32" font-weight="400" fill="#202B2C">BGE-M3: вектор из 1024</text><text x="110" y="583" font-family="Segoe UI" font-size="32" font-weight="400" fill="#202B2C">чисел. Vectorize находит</text><text x="110" y="626" font-family="Segoe UI" font-size="32" font-weight="400" fill="#202B2C">близкие по смыслу</text><text x="110" y="669" font-family="Segoe UI" font-size="32" font-weight="400" fill="#202B2C">фрагменты.</text><text x="110" y="718" font-family="Segoe UI" font-size="31" font-weight="600" fill="#244F6C">До 12 кандидатов</text><rect x="660" y="432" width="510" height="310" fill="#FBFAF6" stroke="#963F32" stroke-width="2"/><text x="690" y="487" font-family="Segoe UI" font-size="40" font-weight="600" fill="#963F32">Поиск по словам</text><text x="690" y="540" font-family="Segoe UI" font-size="32" font-weight="400" fill="#202B2C">FTS5 ищет слова вопроса в</text><text x="690" y="583" font-family="Segoe UI" font-size="32" font-weight="400" fill="#202B2C">текстах: конкретные темы,</text><text x="690" y="626" font-family="Segoe UI" font-size="32" font-weight="400" fill="#202B2C">имена и термины.</text><text x="690" y="718" font-family="Segoe UI" font-size="31" font-weight="600" fill="#963F32">До 12 кандидатов</text><rect x="1240" y="432" width="600" height="310" fill="#FBFAF6" stroke="#AB7A30" stroke-width="2"/><text x="1270" y="487" font-family="Segoe UI" font-size="38" font-weight="600" fill="#AB7A30">Объединение выдачи</text><text x="1270" y="540" font-family="Segoe UI" font-size="32" font-weight="400" fill="#202B2C">Вес рангов: 75% смысл + 25% слова.</text><text x="1270" y="583" font-family="Segoe UI" font-size="32" font-weight="400" fill="#202B2C">До 2 лучших фрагментов</text><text x="1270" y="626" font-family="Segoe UI" font-size="32" font-weight="400" fill="#202B2C">передаются в контекст.</text><text x="1270" y="718" font-family="Segoe UI" font-size="30" font-weight="600" fill="#AB7A30">Отдельно для каждого автора</text><path d="M330,373L330,423" fill="none" stroke="#244F6C" stroke-width="3" marker-end="url(#arrow-244F6C)"/><path d="M915,373L915,423" fill="none" stroke="#963F32" stroke-width="3" marker-end="url(#arrow-963F32)"/><path d="M330,743L330,786L1535,786L1535,751" fill="none" stroke="#244F6C" stroke-width="3" marker-end="url(#arrow-244F6C)"/><path d="M915,743L915,768L1204,768L1204,587L1230,587" fill="none" stroke="#963F32" stroke-width="3" marker-end="url(#arrow-963F32)"/><path d="M1540,788L1540,830" fill="none" stroke="#AB7A30" stroke-width="3" marker-end="url(#arrow-AB7A30)"/><rect x="80" y="844" width="1760" height="110" fill="#202B2C"/><text x="110" y="914" font-family="Segoe UI" font-size="35" font-weight="600" fill="#F1EEE6">Роль + история + найденные фрагменты</text><path d="M890,898L1010,898" fill="none" stroke="#AB7A30" stroke-width="3" marker-end="url(#arrow-AB7A30)"/><text x="1050" y="914" font-family="Segoe UI" font-size="40" font-weight="600" fill="#E0B568">Qwen3 30B</text><text x="1360" y="914" font-family="Segoe UI" font-size="34" font-weight="400" fill="#F1EEE6">→ ответ + источники</text><path d="M80,1005L1840,1005" fill="none" stroke="#C7CEC6" stroke-width="2"/><text x="80" y="1047" font-family="Segoe UI" font-size="25" font-weight="400" fill="#596664">Поиск выполняется по корпусу выбранного автора. Модель не просматривает все книги заново на каждый вопрос.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow-202B2C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#202B2C"/></marker><marker id="arrow-244F6C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#244F6C"/></marker><marker id="arrow-963F32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#963F32"/></marker><marker id="arrow-AB7A30" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#AB7A30"/></marker></defs><rect x="0" y="0" width="1920" height="1080" fill="#F1EEE6"/><text x="80" y="65" font-family="Segoe UI" font-size="24" font-weight="600" fill="#244F6C">HISTORY DUEL</text><path d="M80,90L1840,90" fill="none" stroke="#202B2C" stroke-width="2"/><text x="80" y="170" font-family="Georgia" font-size="58" font-weight="400" fill="#202B2C">Что находится внутри RAG</text><text x="80" y="224" font-family="Segoe UI" font-size="31" font-weight="400" fill="#596664">Подготовленные тексты исходного проекта → отдельный облачный индекс</text><text x="80" y="382" font-family="Segoe UI" font-size="112" font-weight="600" fill="#244F6C">6</text><text x="80" y="437" font-family="Segoe UI" font-size="32" font-weight="400" fill="#596664">PDF-томов</text><text x="690" y="382" font-family="Segoe UI" font-size="112" font-weight="600" fill="#202B2C">4504</text><text x="690" y="437" font-family="Segoe UI" font-size="32" font-weight="400" fill="#596664">текстовых фрагмента</text><text x="1300" y="382" font-family="Segoe UI" font-size="112" font-weight="600" fill="#244F6C">1024</text><text x="1300" y="437" font-family="Segoe UI" font-size="32" font-weight="400" fill="#596664">числа в каждом векторе</text><path d="M80,474L1840,474" fill="none" stroke="#202B2C" stroke-width="2"/><text x="80" y="543" font-family="Georgia" font-size="45" font-weight="400" fill="#244F6C">Чаадаев</text><text x="80" y="598" font-family="Segoe UI" font-size="32" font-weight="400" fill="#244F6C">Тома 1 и 2 · 2327 фрагментов</text><text x="80" y="656" font-family="Segoe UI" font-size="32" font-weight="400" fill="#202B2C">Сочинения, письма,</text><text x="80" y="701" font-family="Segoe UI" font-size="32" font-weight="400" fill="#202B2C">вступительные статьи и</text><text x="80" y="746" font-family="Segoe UI" font-size="32" font-weight="400" fill="#202B2C">комментарии из собрания</text><text x="80" y="791" font-family="Segoe UI" font-size="32" font-weight="400" fill="#202B2C">сочинений.</text><text x="690" y="543" font-family="Georgia" font-size="45" font-weight="400" fill="#963F32">Хомяков</text><text x="690" y="598" font-family="Segoe UI" font-size="32" font-weight="400" fill="#963F32">Тома 1, 2, 3, 8 · 2177 фрагментов</text><text x="690" y="656" font-family="Segoe UI" font-size="32" font-weight="400" fill="#202B2C">Философские, богословские и</text><text x="690" y="701" font-family="Segoe UI" font-size="32" font-weight="400" fill="#202B2C">публицистические тексты из</text><text x="690" y="746" font-family="Segoe UI" font-size="32" font-weight="400" fill="#202B2C">доступных томов.</text><text x="1300" y="543" font-family="Segoe UI" font-size="39" font-weight="600" fill="#202B2C">Подготовка текста</text><text x="1300" y="598" font-family="Segoe UI" font-size="32" font-weight="400" fill="#202B2C">Чанк: до 2200 символов</text><text x="1300" y="648" font-family="Segoe UI" font-size="32" font-weight="400" fill="#202B2C">Перекрытие: 450 символов</text><text x="1300" y="700" font-family="Segoe UI" font-size="32" font-weight="400" fill="#202B2C">Сохраняются автор, том, страница</text><text x="1300" y="745" font-family="Segoe UI" font-size="32" font-weight="400" fill="#202B2C">PDF и доступные заголовки.</text><rect x="80" y="821" width="909.3072824156305" height="48" fill="#244F6C"/><rect x="989.3072824156305" y="821" width="850.6927175843695" height="48" fill="#963F32"/><text x="80" y="922" font-family="Segoe UI" font-size="43" font-weight="600" fill="#202B2C">PDF → текст → фрагменты → BGE-M3 → Vectorize + D1</text><path d="M80,1005L1840,1005" fill="none" stroke="#C7CEC6" stroke-width="2"/><text x="80" y="1047" font-family="Segoe UI" font-size="25" font-weight="400" fill="#596664">В исходной локальной версии использовался nomic-embed-text, 768 измерений. Облачный индекс пересчитан заново.</text></svg>
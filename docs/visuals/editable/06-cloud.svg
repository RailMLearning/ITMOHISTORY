 font-family="Segoe UI" font-size="40" font-weight="600" fill="#F1EEE6">Cloudflare Worker</text><text x="725" y="402" font-family="Segoe UI" font-size="33" font-weight="400" fill="#F1EEE6">Проверяет запрос, собирает контекст и запускает два ответа</text><path d="M1265,456L1265,490L350,490L350,535" fill="none" stroke="#244F6C" stroke-width="3" marker-end="url(#arrow-244F6C)"/><rect x="80" y="547" width="540" height="205" fill="#FBFAF6" stroke="#244F6C" stroke-width="2"/><text x="110" y="608" font-family="Segoe UI" font-size="40" font-weight="600" fill="#244F6C">Vectorize</text><text x="110" y="668" font-family="Segoe UI" font-size="31" font-weight="400" fill="#202B2C">Поиск по смыслу</text><text x="110" y="711" font-family="Segoe UI" font-size="31" font-weight="400" fill="#202B2C">4504 вектора</text><path d="M1265,456L1265,490L960,490L960,535" fill="none" stroke="#AB7A30" stroke-width="3" marker-end="url(#arrow-AB7A30)"/><rect x="690" y="547" width="540" height="205" fill="#FBFAF6" stroke="#AB7A30" stroke-width="2"/><text x="720" y="608" font-family="Segoe UI" font-size="40" font-weight="600" fill="#AB7A30">D1</text><text x="720" y="668" font-family="Segoe UI" font-size="31" font-weight="400" fill="#202B2C">Тексты источников</text><text x="720" y="711" font-family="Segoe UI" font-size="31" font-weight="400" fill="#202B2C">и поиск по словам</text><path d="M1265,456L1265,490L1570,490L1570,535" fill="none" stroke="#963F32" stroke-width="3" marker-end="url(#arrow-963F32)"/><rect x="1300" y="547" width="540" height="205" fill="#FBFAF6" stroke="#963F32" stroke-width="2"/><text x="1330" y="608" font-family="Segoe UI" font-size="40" font-weight="600" fill="#963F32">Workers AI</text><text x="1330" y="668" font-family="Segoe UI" font-size="31" font-weight="400" fill="#202B2C">BGE-M3 + Qwen3 30B</text><text x="1330" y="711" font-family="Segoe UI" font-size="31" font-weight="400" fill="#202B2C">Эмбеддинги и генерация</text><path d="M80,795L1840,795" fill="none" stroke="#202B2C" 
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow-202B2C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#202B2C"/></marker><marker id="arrow-244F6C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#244F6C"/></marker><marker id="arrow-963F32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#963F32"/></marker><marker id="arrow-AB7A30" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#AB7A30"/></marker></defs><rect x="0" y="0" width="1920" height="1080" fill="#F1EEE6"/><text x="80" y="65" font-family="Segoe UI" font-size="24" font-weight="600" fill="#244F6C">HISTORY DUEL</text><path d="M80,90L1840,90" fill="none" stroke="#202B2C" stroke-width="2"/><text x="80" y="170" font-family="Georgia" font-size="58" font-weight="400" fill="#202B2C">Один вопрос — два взгляда</text><text x="80" y="224" font-family="Segoe UI" font-size="31" font-weight="400" fill="#596664">Фрагменты настоящих ответов опубликованной облачной версии</text><rect x="80" y="268" width="1760" height="96" fill="#202B2C"/><text x="112" y="331" font-family="Georgia" font-size="42" font-weight="400" fill="#F1EEE6">Должна ли Россия следовать европейскому пути?</text><rect x="80" y="400" width="850" height="540" fill="#FBFAF6"/><rect x="80" y="400" width="850" height="8" fill="#244F6C"/><text x="110" y="465" font-family="Georgia" font-size="45" font-weight="400" fill="#244F6C">Пётр Чаадаев</text><text x="110" y="511" font-family="Segoe UI" font-size="29" font-weight="400" fill="#596664">Западническая перспектива</text><text x="110" y="578" font-family="Segoe UI" font-size="33" font-weight="400" fill="#202B2C">Европа, несмотря на свои недостатки, обладает</text><text x="110" y="621" font-family="Segoe UI" font-size="33" font-weight="400" fill="#202B2C">более глубоким опытом свободы, просвещения и</text><text x="110" y="664" font-family="Segoe UI" font-size="33" font-weight="400" fill="#202B2C">правовых институтов. Россия же, несмотря на</text><text x="110" y="707" font-family="Segoe UI" font-size="33" font-weight="400" fill="#202B2C">попытки включиться в европейскую систему, часто</text><text x="110" y="750" font-family="Segoe UI" font-size="33" font-weight="400" fill="#202B2C">воспринимается как чуждая ей сила. …</text><text x="110" y="901" font-family="Segoe UI" font-size="29" font-weight="600" fill="#244F6C">Источник: том 1, страница PDF 572</text><rect x="990" y="400" width="850" height="540" fill="#FBFAF6"/><rect x="990" y="400" width="850" height="8" fill="#963F32"/><text x="1020" y="465" font-family="Georgia" font-size="45" font-weight="400" fill="#963F32">Алексей Хомяков</text><text x="1020" y="511" font-family="Segoe UI" font-size="29" font-weight="400" fill="#596664">Славянофильская перспектива</text><text x="1020" y="578" font-family="Segoe UI" font-size="33" font-weight="400" fill="#202B2C">Россия не должна следовать европейскому пути в</text><text x="1020" y="621" font-family="Segoe UI" font-size="33" font-weight="400" fill="#202B2C">ущерб своей духовной и национальной</text><text x="1020" y="664" font-family="Segoe UI" font-size="33" font-weight="400" fill="#202B2C">самобытности. Её история показывает, что она</text><text x="1020" y="707" font-family="Segoe UI" font-size="33" font-weight="400" fill="#202B2C">получила Христианство в особой форме, которая</text><text x="1020" y="750" font-family="Segoe UI" font-size="33" font-weight="400" fill="#202B2C">отличалась живым духовным единством и</text><text x="1020" y="793" font-family="Segoe UI" font-size="33" font-weight="400" fill="#202B2C">свободой, а не внешними нормами. …</text><text x="1020" y="901" font-family="Segoe UI" font-size="29" font-weight="600" fill="#963F32">Источник: том 1, страница PDF 252</text><path d="M80,1005L1840,1005" fill="none" stroke="#C7CEC6" stroke-width="2"/><text x="80" y="1047" font-family="Segoe UI" font-size="25" font-weight="400" fill="#596664">Учебная ИИ-реконструкция. Текст ответа модели не является буквальной цитатой исторического лица.</text></svg>
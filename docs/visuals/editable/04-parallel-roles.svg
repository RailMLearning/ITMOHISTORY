<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow-202B2C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#202B2C"/></marker><marker id="arrow-244F6C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#244F6C"/></marker><marker id="arrow-963F32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#963F32"/></marker><marker id="arrow-AB7A30" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#AB7A30"/></marker></defs><rect x="0" y="0" width="1920" height="1080" fill="#F1EEE6"/><text x="80" y="65" font-family="Segoe UI" font-size="24" font-weight="600" fill="#244F6C">HISTORY DUEL</text><path d="M80,90L1840,90" fill="none" stroke="#202B2C" stroke-width="2"/><text x="80" y="170" font-family="Georgia" font-size="58" font-weight="400" fill="#202B2C">Две роли на одной языковой модели</text><text x="80" y="224" font-family="Segoe UI" font-size="31" font-weight="400" fill="#596664">Один пользовательский вопрос запускает два независимых запроса к Qwen3 30B</text><rect x="670" y="273" width="580" height="85" fill="#202B2C"/><text x="713" y="329" font-family="Segoe UI" font-size="35" font-weight="600" fill="#F1EEE6">Один вопрос пользователя</text><path d="M960,359L960,390L505,390L505,424" fill="none" stroke="#244F6C" stroke-width="3" marker-end="url(#arrow-244F6C)"/><path d="M960,359L960,390L1415,390L1415,424" fill="none" stroke="#963F32" stroke-width="3" marker-end="url(#arrow-963F32)"/><rect x="80" y="433" width="850" height="345" fill="#FBFAF6" stroke="#244F6C" stroke-width="2"/><text x="108" y="493" font-family="Georgia" font-size="43" font-weight="400" fill="#244F6C">Чаадаев</text><text x="108" y="550" font-family="Segoe UI" font-size="31" font-weight="400" fill="#202B2C">Европейский исторический опыт, просвещение и</text><text x="108" y="591" font-family="Segoe UI" font-size="31" font-weight="400" fill="#202B2C">развитие институтов.</text><text x="108" y="674" font-family="Segoe UI" font-size="31" font-weight="600" fill="#244F6C">Свой корпус: 2 тома · 2327 фрагментов</text><text x="108" y="729" font-family="Consolas" font-size="31" font-weight="400" fill="#202B2C">historyByCharacter.west</text><rect x="990" y="433" width="850" height="345" fill="#FBFAF6" stroke="#963F32" stroke-width="2"/><text x="1018" y="493" font-family="Georgia" font-size="43" font-weight="400" fill="#963F32">Хомяков</text><text x="1018" y="550" font-family="Segoe UI" font-size="31" font-weight="400" fill="#202B2C">Соборность, православная традиция и свободное</text><text x="1018" y="591" font-family="Segoe UI" font-size="31" font-weight="400" fill="#202B2C">духовное единство.</text><text x="1018" y="674" font-family="Segoe UI" font-size="31" font-weight="600" fill="#963F32">Свой корпус: 4 тома · 2177 фрагментов</text><text x="1018" y="729" font-family="Consolas" font-size="31" font-weight="400" fill="#202B2C">historyByCharacter.slav</text><rect x="80" y="820" width="1760" height="144" fill="#202B2C"/><text x="110" y="867" font-family="Segoe UI" font-size="30" font-weight="400" fill="#D1D8D1">Параллельный запуск в backend</text><text x="110" y="924" font-family="Consolas" font-size="35" font-weight="400" fill="#F2EFE6">Promise.all([generate(env, &#x27;west&#x27;, …), generate(env, &#x27;slav&#x27;, …)])</text><path d="M80,1005L1840,1005" fill="none" stroke="#C7CEC6" stroke-width="2"/><text x="80" y="1047" font-family="Segoe UI" font-size="25" font-weight="400" fill="#596664">У каждого персонажа своя история: до 8 последних сообщений. На экране сравниваются ответы на один и тот же вопрос.</text></svg>